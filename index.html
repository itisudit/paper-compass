<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Paper Compass helps readers engage deeply and thoughtfully with scientific papers."
  />

  <title>Paper Compass</title>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>

<body>
  <main class="app-shell">
    <section class="opening" aria-labelledby="page-title">
      <div class="opening-content">
        <p class="eyebrow">A thoughtful reading space</p>

        <h1 id="page-title">
          Paper <em>Compass</em>
        </h1>

        <p class="intro">
          A calmer way to read scientific papers, one that keeps the paper
          central and your own judgement in the lead.
        </p>

        <p class="principle">
          Reduce cognitive load without reducing intellectual load.
        </p>

        <button class="begin-button" type="button">
          Begin with a paper
        </button>
      </div>
    </section>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
